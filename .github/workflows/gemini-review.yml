name: Gemini Code Assist Review

"on":
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/gemini review'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Start Gemini API shim
        env:
          AIMONKEY_COOKIE: ${{ secrets.AIMONKEY_COOKIE }}
        run: |
          pip install -q requests
          nohup python3 .github/scripts/gemini_shim.py 8765 &
          sleep 2
          echo "Shim running on :8765"

      - name: Download and patch gemini-review-bot
        run: |
          mkdir -p /tmp/grb
          curl -sL https://github.com/jgunnink/gemini-review-bot/archive/refs/heads/main.tar.gz | tar -xz -C /tmp/grb --strip-components=1
          cd /tmp/grb
          npm ci --omit=dev 2>&1 | tail -3

          # Patch: inject httpOptions.baseUrl into GoogleGenAI constructor
          sed -i 's|new GoogleGenAI({ apiKey, vertexai: useVertex })|new GoogleGenAI({ apiKey, vertexai: useVertex, httpOptions: { baseUrl: process.env.GEMINI_SHIM_URL \|\| undefined } })|g' src/gemini.ts
          echo "Patched lines:"
          grep -n "GoogleGenAI" src/gemini.ts

      - name: Run review bot
        env:
          INPUT_GEMINI_API_KEY: "shim-routed-via-aimonkey"
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODEL: "gemini-flash-latest"
          INPUT_INSTRUCTIONS: "Focus on NCCL collective symmetry, deadlock risks, and test coverage for this distributed training engine."
          INPUT_CONFIG_PATH: ".github/gemini-review.yml"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_SHIM_URL: "http://127.0.0.1:8765"
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        working-directory: /tmp/grb
        run: node --experimental-strip-types src/index.ts
