name: Claude Review Relay

"on":
  workflow_dispatch:
    inputs:
      gist_id:
        description: "Gist ID"
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COOKIE: ${{ secrets.AIMONKEY_COOKIE }}
      GIST_ID: ${{ inputs.gist_id }}
      GH_TOKEN: ${{ github.token }}
      ORG: "80008ad8-c3c8-4f47-b1a1-ca77c382bff2"
    steps:
      - name: Fetch diff
        run: |
          gh api "/gists/${GIST_ID}" --jq '.files["diff.patch"].content' > /tmp/diff.txt
          gh api "/gists/${GIST_ID}" --jq '.files["review_request.json"].content' > /tmp/req.json
          echo "Diff: $(wc -c < /tmp/diff.txt) bytes"

      - name: Create conversation
        id: conv
        run: |
          CONV_ID=$(curl -sf "https://c.aimonkey.plus/api/organizations/${ORG}/chat_conversations" \
            -H 'content-type: application/json' \
            -H 'anthropic-client-platform: web_claude_ai' \
            -H 'origin: https://c.aimonkey.plus' \
            -b "${COOKIE}" \
            -d '{"name":"","model":"claude-sonnet-4-20250514","include_conversation_preferences":true}' \
            | jq -r '.uuid')
          echo "conv_id=${CONV_ID}" >> "$GITHUB_OUTPUT"
          echo "Conversation: ${CONV_ID}"

      - name: Send review request
        run: |
          pip install -q requests
          python3 - << 'PYSCRIPT'
          import json, os, requests

          conv_id = "${{ steps.conv.outputs.conv_id }}"
          org = os.environ["ORG"]
          cookie = os.environ["COOKIE"]

          with open("/tmp/req.json") as f:
              prompt = json.load(f)["prompt"]
          with open("/tmp/diff.txt") as f:
              diff = f.read()

          msg = prompt + "\n\n```diff\n" + diff + "\n```"

          url = f"https://c.aimonkey.plus/api/organizations/{org}/chat_conversations/{conv_id}/completion"
          resp = requests.post(url, json={
              "prompt": msg, "timezone": "UTC", "locale": "en-US",
              "model": "claude-sonnet-4-20250514",
              "tools": [], "attachments": [], "files": [],
              "sync_sources": [], "rendering_mode": "messages",
          }, headers={
              "accept": "text/event-stream",
              "anthropic-client-platform": "web_claude_ai",
              "origin": "https://c.aimonkey.plus",
              "Cookie": cookie,
          }, stream=True, timeout=120)

          full = ""
          for line in resp.iter_lines(decode_unicode=True):
              if line and line.startswith("data: "):
                  d = line[6:]
                  if d == "[DONE]":
                      break
                  try:
                      ev = json.loads(d)
                      if ev.get("type") == "content_block_delta":
                          full += ev.get("delta", {}).get("text", "")
                  except json.JSONDecodeError:
                      pass

          with open("/tmp/review.md", "w") as f:
              f.write(full)
          print(f"Review collected: {len(full)} chars")
          PYSCRIPT

      - name: Write result to Gist
        run: |
          if [ -s /tmp/review.md ]; then
            python3 -c "
          import json
          with open('/tmp/review.md') as f: review = f.read()
          payload = json.dumps({'files':{'review_result.md':{'content':review},'review_request.json':{'content':json.dumps({'status':'completed'})}}})
          print(payload)
          " | gh api --method PATCH "/gists/${GIST_ID}" --input -
            echo "Result written to Gist"
          else
            echo "No review output, writing error"
            echo '{"files":{"review_result.md":{"content":"Review failed - check Actions logs"},"review_request.json":{"content":"{\"status\":\"error\"}"}}}' | gh api --method PATCH "/gists/${GIST_ID}" --input -
          fi
