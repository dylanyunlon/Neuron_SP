name: Claude Review Relay

"on":
  workflow_dispatch:
    inputs:
      gist_id:
        description: "Gist ID containing review request"
        required: true
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run review relay
        env:
          COOKIE: ${{ secrets.AIMONKEY_COOKIE }}
          GIST_ID: ${{ inputs.gist_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ORG="80008ad8-c3c8-4f47-b1a1-ca77c382bff2"

          gh api "/gists/${GIST_ID}" --jq '.files["diff.patch"].content' > /tmp/diff.txt
          gh api "/gists/${GIST_ID}" --jq '.files["review_request.json"].content' > /tmp/req.json
          echo "Diff: $(wc -c < /tmp/diff.txt) bytes"

          CONV_ID=$(curl -sf "https://c.aimonkey.plus/api/organizations/${ORG}/chat_conversations" \
            -H 'content-type: application/json' \
            -H 'anthropic-client-platform: web_claude_ai' \
            -H 'origin: https://c.aimonkey.plus' \
            -b "${COOKIE}" \
            -d '{"name":"","model":"claude-sonnet-4-20250514","include_conversation_preferences":true}' \
            | jq -r '.uuid')
          echo "Conversation: $CONV_ID"

          python3 << 'PYSCRIPT'
          import json, sys, os, urllib.request
          org_id = os.environ.get("ORG_ID", "80008ad8-c3c8-4f47-b1a1-ca77c382bff2")
          cookie = os.environ["COOKIE"]
          with open("/tmp/req.json") as f:
              prompt = json.load(f)["prompt"]
          with open("/tmp/diff.txt") as f:
              diff = f.read()
          conv_resp = json.loads(open("/dev/stdin","r").read()) if False else None
          # Re-read conv_id from env
          import subprocess
          r = subprocess.run(["gh","api",f"/gists/{os.environ['GIST_ID']}","--jq",'.files["diff.patch"].content'],capture_output=True,text=True)
          msg = prompt + "\n\n```diff\n" + diff + "\n```"
          body = json.dumps({"prompt":msg,"timezone":"UTC","locale":"en-US","model":"claude-sonnet-4-20250514","tools":[],"attachments":[],"files":[],"sync_sources":[],"rendering_mode":"messages"}).encode()
          PYSCRIPT

          echo "Review sent"
